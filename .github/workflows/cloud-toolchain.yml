name: PS2Palace360 - Cloud Toolchain

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ps2palace360-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-validation:
    name: Source and host validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect project layout
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Commit: ${GITHUB_SHA}"
          find . -maxdepth 4 -type f -not -path './.git/*' -print | sort
          if [[ ! -f Makefile || ! -d src/ps2 || ! -d tests ]]; then
            echo "::error::The repository does not yet contain the emulator source tree, Makefile, and tests."
            echo "Upload the contents of the PS2Palace360 development ZIP to the repository root first."
            exit 1
          fi
      - name: Validate package
        run: make validate
      - name: Run native tests
        run: make test-host
      - name: Package source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          git archive --format=zip --prefix=PS2Palace360/ HEAD -o build/PS2Palace360-source.zip
          sha256sum build/PS2Palace360-source.zip > build/SHA256SUMS.txt
      - name: Upload source and test artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PS2Palace360-source-${{ github.run_number }}
          path: |
            build/PS2Palace360-source.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  xbox360-build:
    name: Xbox 360 libXenon build
    runs-on: ubuntu-latest
    needs: host-validation
    steps:
      - uses: actions/checkout@v4
      - name: Check whether libXenon toolchain is provisioned
        shell: bash
        run: |
          set -euo pipefail
          make check
          make toolchain-check
          make xex
          test -s build/default.xex
          sha256sum build/default.xex > build/SHA256SUMS.txt
      - name: Upload Xbox binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PS2Palace360-default-xex-${{ github.run_number }}
          path: |
            build/default.xex
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
