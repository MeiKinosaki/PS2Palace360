name: PS2Palace360 - Cloud Toolchain

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ps2palace360-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-validation:
    name: Source and host validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect project layout
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Workspace: $(pwd)"
          echo "Git root: $(git rev-parse --show-toplevel)"
          echo "Checked out: $(git rev-parse HEAD)"
          echo "Tracked project files:"
          git ls-files | sed -n '1,120p'
          echo "Required path diagnostics:"
          for path in Makefile src/ps2 tests; do
            if [[ -e "$path" ]]; then echo "FOUND: $path"; else echo "MISSING: $path"; fi
          done
          if [[ ! -f Makefile || ! -d src/ps2 || ! -d tests ]]; then
            echo "::error::Required project files are missing after checkout. See tracked-file and workspace diagnostics above."
            exit 1
          fi
      - name: Validate package
        run: make validate
      - name: Run native tests
        run: make test-host
      - name: Report toolchain prerequisites
        if: always()
        shell: bash
        run: |
          if command -v xenon-gcc >/dev/null 2>&1 && command -v elf2xex >/dev/null 2>&1; then
            echo "Xenon toolchain prerequisites: present"
          else
            echo "Xenon toolchain prerequisites: missing on this runner; XEX build requires a provisioned libXenon environment"
          fi
      - name: Package source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          git archive --format=zip --prefix=PS2Palace360/ HEAD -o build/PS2Palace360-source.zip
          sha256sum build/PS2Palace360-source.zip > build/SHA256SUMS.txt
      - name: Upload source and test artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PS2Palace360-source-${{ github.run_number }}
          path: |
            build/PS2Palace360-source.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  xbox360-build:
    name: Xbox 360 libXenon build
    runs-on: ubuntu-latest
    needs: host-validation
    steps:
      - uses: actions/checkout@v4
      - name: Check whether libXenon toolchain is provisioned
        shell: bash
        run: |
          set -euo pipefail
          make check
          make toolchain-check
          make xex
          test -s build/default.xex
          sha256sum build/default.xex > build/SHA256SUMS.txt
      - name: Upload Xbox binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PS2Palace360-default-xex-${{ github.run_number }}
          path: |
            build/default.xex
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
